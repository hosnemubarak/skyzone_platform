version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: skyzone_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-skyzone}
      POSTGRES_USER: ${DB_USER:-skyzone_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skyzone_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-skyzone_user} -d ${DB_NAME:-skyzone}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: skyzone_backend
    restart: always
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      - DB_HOST=db
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.skyzoneintl.com/api}
    container_name: skyzone_frontend
    restart: always
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    depends_on:
      - backend

volumes:
  postgres_data:

