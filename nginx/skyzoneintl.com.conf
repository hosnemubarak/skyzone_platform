server {
    listen 80;
    server_name skyzoneintl.com www.skyzoneintl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name skyzoneintl.com www.skyzoneintl.com;
    
    ssl_certificate /etc/letsencrypt/live/skyzoneintl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyzoneintl.com/privkey.pem;

    # SSL security configurations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ENABLE GZIP COMPRESSION
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # MAIN APPLICATION ROUTE
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;                 # CRITICAL FOR NEXT.JS
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # CACHE COMPILED JS/CSS
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;                 # CRITICAL
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # CACHE RAW PUBLIC IMAGES (e.g. /images/logo.png)
    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;                 # CRITICAL
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # CACHE NEXT.JS OPTIMIZED IMAGES (NO TRAILING SLASH!)
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;                 # CRITICAL FOR IMAGE OPTIMIZER
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
